[project]
name = "MyProject"
description = "Short description of your project"
audience = "developers"

[llm]
model = "anthropic/claude-haiku-4-5"  # any OpenRouter model slug

[syndication]
tone = "shipping-update" # shipping-update | announcement | changelog
hashtags = ["#myproject", "#indiedev"]
max_posts = 3

[achaean]
# A checked-out Achaean content repository. The pipeline writes drafts beneath
# posts/ here only when called with --write. It never commits or publishes.
content_dir = ".achaean-drafts"
tags = ["buildinpublic"]

[filters]
ignore_paths = ["docs/", ".github/", "*.md", "*.lock"]
min_diff_lines = 5
